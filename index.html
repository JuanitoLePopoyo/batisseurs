<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Bâtisseurs de Merveilles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#2b2520;--muted:#776c5f;--line:#e3d9c6;--gold:#b08a3e;--gold-soft:#f0e3c4;--accent:#8c2f22;--bar:#e9e0cf;--title:'Cinzel',Georgia,serif;--body:'Lora',Georgia,serif}
body.sobre{--bg:#16171b;--card:#202227;--ink:#ecebe8;--muted:#9a9a9f;--line:#33353c;--gold:#d6b25e;--gold-soft:#3a3322;--accent:#e0755f;--bar:#2c2e34;--title:system-ui,sans-serif;--body:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6}
h1,h2,h3{font-family:var(--title);font-weight:700;letter-spacing:.02em;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);padding:28px 0 22px;text-align:center}
header h1{font-size:clamp(26px,4vw,40px);color:var(--gold)}
header p{color:var(--muted);margin:6px 0 0}
section{margin:36px 0}
section>h2{font-size:22px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
section>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero-img{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bar);position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.bar{height:10px;border-radius:99px;background:var(--bar);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--gold);transition:width .8s ease}
.big .bar{height:16px}
.res{margin:10px 0}
.res-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.muted{color:var(--muted)}
.event{background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600}
.jobs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.job{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--bg)}
.job code{font-size:13px;color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ph{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.ph .img{aspect-ratio:4/3;background:var(--bar);position:relative;overflow:hidden}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block}
.ph.locked .img>*{filter:blur(8px) grayscale(1);opacity:.5}
.ph .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;filter:none!important;opacity:1!important}
.ph .cap{padding:10px 12px;font-size:14px}
.ph .cap b{font-family:var(--title)}
.ph.current{outline:3px solid var(--gold)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:18px}
.step{text-align:center;width:150px}
.step .blk{border-radius:10px 10px 0 0;background:var(--gold-soft);border:1px solid var(--gold);border-bottom:none;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:var(--title);font-size:26px;color:var(--gold)}
.step .nm{font-weight:600;margin-bottom:2px;word-break:break-word}
.step .pt{font-size:13px;color:var(--muted);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 6px;border-top:1px solid var(--line)}
td.r{text-align:right;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.museum{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.museum .img{aspect-ratio:16/9;background:var(--bar);border-radius:10px;overflow:hidden;margin-bottom:12px}
.museum img,.museum svg{width:100%;height:100%;object-fit:cover;display:block}
.plaque{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;max-height:120px;overflow:auto}
details summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:8px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how .card{padding:16px}
.how code{font-size:16px;color:var(--accent);font-weight:600}
.live{margin:18px 0 0;border-radius:12px;padding:12px 16px;text-align:center;font-weight:600}
.live.on{background:#e6f3e4;color:#1f5e23;border:1px solid #b9dcb5}
.live.off{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
body.sobre .live.on{background:#1f3322;color:#a8e0ad;border-color:#2f5a34}
.empty{text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="title">Les Bâtisseurs de Merveilles</h1><p>Construisez ensemble les merveilles du monde, depuis le tchat du stream.</p></div></header>
<div class="wrap" id="liveBox"></div>
<main class="wrap">
  <section id="current"></section>
  <section id="gallery-sec"><h2>Galerie du chantier</h2><div class="gallery" id="gallery"></div></section>
  <section class="two">
    <div><h2 style="margin-bottom:16px">Podium du chantier</h2><div class="card" id="podium"></div></div>
    <div><h2 style="margin-bottom:16px">Légendes de tous les temps</h2><div class="card" id="alltime"></div></div>
  </section>
  <section><h2>Comment participer</h2><div class="how" id="how"></div></section>
  <section id="museum-sec"><h2>Le musée des merveilles</h2><div class="museum" id="museum"></div></section>
  <section id="next-sec"><h2>Prochains chantiers</h2><div id="next"></div></section>
</main>
<footer id="foot"></footer>
<script>window.STATIC_STATE_URL = "https://raw.githubusercontent.com/JuanitoLePopoyo/batisseurs/donnees/state.json";</script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Math.round(n).toLocaleString('fr-FR');
const $ = (id) => document.getElementById(id);
const safeUrl = (u) => (/^(\/uploads\/|https?:\/\/)/.test(u || '') ? u : '');
function placeholder(label, n) {
  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(label)}">
    <rect width="400" height="300" fill="var(--bar)"/>
    <g fill="none" stroke="var(--gold)" stroke-width="6" opacity=".7">
      <path d="M90 230 V140 a110 110 0 0 1 220 0 V230"/><path d="M140 230 V150 a60 60 0 0 1 120 0 V230"/>
      <line x1="70" y1="230" x2="330" y2="230"/><line x1="80" y1="90" x2="320" y2="90" opacity=".4"/>
    </g>
    ${n ? `<text x="200" y="275" text-anchor="middle" font-family="Cinzel,serif" font-size="22" fill="var(--muted)">${esc(n)}</text>` : ''}
  </svg>`;
}
const img = (url, label, n) => safeUrl(url) ? `<img src="${esc(safeUrl(url))}" alt="${esc(label)}" loading="lazy">` : placeholder(label, n);

function render(s) {
  document.body.className = s.theme === 'sobre' ? 'sobre' : '';
  $('title').textContent = s.title; document.title = s.title;
  const c = s.commands, w = s.active;
  $('how').innerHTML = `
    <div class="card"><code>!${esc(c.job)} &lt;métier&gt;</code><p class="muted">Choisis ton métier pour ce chantier. Tu pourras en changer de temps en temps.</p></div>
    <div class="card"><code>!${esc(c.work)}</code><p class="muted">Travaille sur le chantier. Une fois toutes les ${s.cooldownMinutes} minutes : inutile de spammer.</p></div>
    <div class="card"><code>!${esc(c.status)}</code><p class="muted">Affiche l'avancement du chantier dans le tchat.</p></div>`;

  if (!w) {
    $('current').innerHTML = `<div class="card empty"><h2>Aucun chantier en cours</h2><p>Le prochain chantier ouvrira bientôt. Reste dans le coin !</p></div>`;
    $('gallery-sec').style.display = 'none';
    $('podium').innerHTML = `<p class="empty">Le podium apparaîtra au prochain chantier.</p>`;
  } else {
    $('gallery-sec').style.display = '';
    const cp = w.currentPhase;
    const shown = [...w.phases].slice(0, w.phaseIndex + 1).reverse().find((p) => safeUrl(p.image));
    $('current').innerHTML = `<div class="card hero">
      <div><div class="hero-img">${img(shown?.image || w.thumb, w.name, '')}</div></div>
      <div>
        <span class="badge">Chantier en cours · ${w.builderCount} bâtisseur${w.builderCount > 1 ? 's' : ''}</span>
        <h2 style="font-size:30px;margin:10px 0 4px">${esc(w.name)}</h2>
        <p class="muted" style="margin:0 0 14px">${esc(w.description)}</p>
        <div class="big"><div class="res-top"><b>Avancement total</b><b>${Math.floor(w.percent)} %</b></div><div class="bar"><div style="width:${w.percent}%"></div></div></div>
        ${s.event ? `<div class="event">🚚 Livraison spéciale : gains ×${s.event.multiplier} sur ${esc(s.event.label)} !</div>` : ''}
        ${cp ? `<h3 style="margin:18px 0 6px;font-size:17px">Phase ${w.phaseIndex + 1}/${w.phaseCount} : ${esc(cp.name)}</h3>
        ${cp.resources.map((r) => `<div class="res"><div class="res-top"><span>${esc(r.name)}</span><span class="muted">${fmt(r.have)} / ${fmt(r.need)}</span></div>
          <div class="bar"><div style="width:${(r.have / r.need) * 100}%;background:${esc(r.color)}"></div></div></div>`).join('')}` : ''}
        <div class="jobs">${w.jobs.map((j) => `<div class="job">${esc(j.emoji)} <b>${esc(j.name)}</b> · <code>!${esc(c.job)} ${esc(j.id)}</code> <span class="muted">(${w.jobCounts[j.id] || 0})</span></div>`).join('')}</div>
      </div></div>`;
    $('gallery').innerHTML = w.phases.map((p, i) => {
      const cls = p.done ? 'done' : i === w.phaseIndex ? 'current' : 'locked';
      const state = p.done ? '✅ Terminée' : i === w.phaseIndex ? '🏗️ En construction' : '🔒 À venir';
      return `<div class="ph ${cls}"><div class="img">${img(p.image, p.name, 'Phase ' + (i + 1))}${cls === 'locked' ? '<div class="lock">🔒</div>' : ''}</div>
        <div class="cap"><b>${i + 1}. ${esc(p.name)}</b><br><span class="muted">${state}</span></div></div>`;
    }).join('') + `<div class="ph ${w.status === 'terminee' ? 'done' : 'locked'}"><div class="img">${img(w.finalImage || w.thumb, w.name + ' terminé', 'Merveille achevée')}${w.status === 'terminee' ? '' : '<div class="lock">🏆</div>'}</div>
        <div class="cap"><b>${esc(w.name)}</b><br><span class="muted">La merveille achevée</span></div></div>`;
    const t = w.top;
    if (!t.length) $('podium').innerHTML = `<p class="empty">Personne n'a encore travaillé sur ce chantier. Sois le premier !</p>`;
    else {
      const order = [1, 0, 2].filter((i) => t[i]);
      const h = [110, 80, 60];
      $('podium').innerHTML = `<div class="podium">${order.map((i) => `<div class="step"><div class="nm">${esc(t[i].name)}</div><div class="pt">${fmt(t[i].points)} pts</div>
          <div class="blk" style="height:${h[i]}px">${i + 1}</div></div>`).join('')}</div>
        <table>${t.slice(3).map((p, i) => `<tr><td>${i + 4}.</td><td>${esc(p.name)}</td><td class="r muted">${fmt(p.points)} pts</td></tr>`).join('')}</table>`;
    }
  }
  $('alltime').innerHTML = s.allTime.length ? `<table>${s.allTime.map((p, i) => `<tr><td>${i + 1}.</td><td>${esc(p.name)}</td>
      <td class="r muted">${p.wonders ? p.wonders + ' 🏛️' : ''}</td><td class="r">${fmt(p.points)} pts</td></tr>`).join('')}</table>` : `<p class="empty">Le classement se remplira au fil des chantiers.</p>`;

  $('museum-sec').style.display = s.completed.length ? '' : 'none';
  $('museum').innerHTML = s.completed.map((m) => `<div class="card">
      <div class="img">${img(m.finalImage || m.thumb || [...m.phases].reverse().find((p) => safeUrl(p.image))?.image, m.name, '')}</div>
      <h3>${esc(m.name)}</h3>
      <p class="muted" style="margin:4px 0;font-size:14px">Achevée le ${new Date(m.completedAt).toLocaleDateString('fr-FR')} · ${m.builders.length} bâtisseurs</p>
      <div>${m.top.map((p, i) => `${['🥇', '🥈', '🥉'][i]} ${esc(p.name)}`).join(' &nbsp; ')}</div>
      <details><summary>Plaque d'inauguration</summary><div class="plaque">${m.builders.map(esc).join(' · ')}</div></details>
    </div>`).join('');
  $('next-sec').style.display = s.upcoming.length ? '' : 'none';
  $('next').innerHTML = `<div class="jobs">${s.upcoming.map((u) => `<div class="job">🏛️ ${esc(u.name)}</div>`).join('')}</div>`;
  if (s.updatedAt) { // version publiée en ligne (GitHub Pages)
    const open = s.live && Date.now() - s.updatedAt < 20 * 60_000;
    const twitch = s.channel ? ` sur <a style="color:inherit" href="https://twitch.tv/${esc(s.channel)}" target="_blank" rel="noopener">twitch.tv/${esc(s.channel)}</a>` : '';
    $('liveBox').innerHTML = open
      ? `<div class="live on">🔴 Le chantier est ouvert : le live est en cours${twitch} ! Tape !${esc(c.work)} dans le tchat.</div>`
      : `<div class="live off">🌙 Le chantier est fermé pour le moment. Il rouvre pendant les lives${twitch}.</div>`;
  }
  $('foot').innerHTML = (s.updatedAt ? `Dernière mise à jour : ${new Date(s.updatedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}<br>` : '') + (s.channel ? `Un jeu communautaire de la chaîne <a style="color:var(--gold)" href="https://twitch.tv/${esc(s.channel)}" target="_blank" rel="noopener">twitch.tv/${esc(s.channel)}</a>` : '');
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => render(JSON.parse(e.data)));
  es.onerror = () => { es.close(); setTimeout(connect, 5000); };
}
if (window.STATIC_STATE_URL) {
  // Version en ligne : lit le dernier état publié, rafraîchi chaque minute
  const load = () => fetch(window.STATIC_STATE_URL + '?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then(render).catch(() => {});
  load();
  setInterval(load, 60_000);
} else {
  fetch('/api/state').then((r) => r.json()).then(render).finally(connect);
}
</script>
</body>
</html>
